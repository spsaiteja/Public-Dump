info:
  version: "1.0.0"
  title: IBPS APIs
  description: Combined IBPS APIs — Create SR, Update Work Item, and WI Status
  contact:
    name: API Support
    email: support@rakbank.ae
  x-kong-target: internal

servers:
  - url: https://ANT2CASSVCS03.rakbanktst.ae:9443/IbpsCustomRestAPI/api/v1
    description: IBPS Create SR Server
    x-kong-env: develop
  - url: https://ANT2CASSVCS03.rakbanktst.ae:9443/IbpsCustomRestAPI/api/v1
    description: IBPS UAT Server 4
    x-kong-env: sit
  - url: https://ANT2CASSVCS03.rakbanktst.ae:9443/IbpsCustomRestAPI/api/v1
    description: IBPS UAT Server 2
    x-kong-env: uat



tags:
  - name: CREATE_SR
    description: Card Dispute Service Request Creation APIs
  - name: UPDATE_WI
    description: Work Item Update APIs
  - name: WI_STATUS
    description: Work Item Status Retrieval APIs

x-kong-plugin-acl:
  config:
    allow:
      - ibps-apis-acl-grp

x-kong-plugin-pre-function:
  name: pre-function
  config:
    access:
      - |
          return function()
              local request_body, err = kong.request.get_raw_body()

              if request_body then
                  kong.log.set_serialize_value("rb.body", request_body)
              else
                  kong.log.set_serialize_value("rb.body_error", err)
              end

              kong.service.request.enable_buffering()
          end
    log:
      - |
          return function()
              local response_body = kong.service.response.get_raw_body()

              if response_body then
                  kong.log.set_serialize_value("rs.body", response_body)
              end
          end

paths:

  # ─── Create Service Request ──────────────────────────────────────────────
  /IBPS/create:
    post:
      tags:
        - CREATE_SR
      summary: Create Service Request for Card Dispute
      operationId: createSR
      parameters:
        - name: X-Request-UUID
          in: header
          required: true
          description: Unique identifier for tracking the request.
          schema:
            type: string
            format: uuid
            examples:
              - "123e4567-e89b-12d3-a456-426614174000"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSRRequest"
      responses:
        "200":
          description: Service Request Created Successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSRSuccessResponse"
        "400":
          description: Business Errors (2000–2999)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSRErrorResponse"
        "500":
          description: Technical Errors (1000–1999)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSRErrorResponse"
      x-kong-plugin-openid-connect:
        name: openid-connect
        enabled: true
        _config: sbo_standard_token_openid_config_int
        config:
          consumer_claim:
            - client_id
          consumer_by:
            - username
          anonymous: anonymous-deny
          scopes:
            - write:create-service-request
          scopes_required:
            - write:create-service-request
      x-kong-plugin-key-auth:
        config:
          key_names:
            - apikey
            - x-api-key
          anonymous: anonymous-deny

  # ─── Update Work Item ────────────────────────────────────────────────────
  /IBPS/update:
    post:
      tags:
        - UPDATE_WI
      summary: Update Work Item
      description: Initiates or updates a process based on the work item provided.
      operationId: updateProcess
      parameters:
        - name: X-Request-UUID
          in: header
          required: true
          description: Unique identifier for tracking the request.
          schema:
            type: string
            format: uuid
            examples: ["123e4567-e89b-12d3-a456-426614174000"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessRequest"
            examples:
              sample_request:
                summary: Sample Workitem Update Request
                value:
                  ProcessName: "TS"
                  SubProcessName: "Card Dispute"
                  WINumber: "TS-0000000001-process"
                  Channel: "DEH"
                  DBReferenceID: "12345678"
                  WIUpdateAction: "Cancel"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateWISuccessResponse"
              examples:
                success:
                  summary: Successful Response
                  value:
                    ReturnCode: "0"
                    ReturnDesc: "Success"
                    WorkitemNumber: "TS-0000000001-process"
                    RequestID: "123e4567-e89b-12d3-a456-426614174000"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateWIErrorResponse"
              examples:
                bad_request:
                  summary: Bad Request
                  value:
                    ReturnCode: "1001"
                    ReturnDesc: "Invalid Operation type in request URL."
                    WorkitemNumber: "TS-0000000001-process"
                    RequestId: "123e4567-e89b-12d3-a456-426614174000"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateWIErrorResponse"
              examples:
                internal_error:
                  summary: Internal Server Error
                  value:
                    ReturnCode: "5000"
                    ReturnDesc: "Internal server error occurred while processing the request"
                    WorkitemNumber: "TS-0000000001-process"
                    RequestId: "123e4567-e89b-12d3-a456-426614174000"
      x-kong-plugin-openid-connect:
        name: openid-connect
        enabled: true
        _config: sbo_standard_token_openid_config_int
        config:
          consumer_claim:
            - client_id
          consumer_by:
            - username
          anonymous: anonymous-deny
          scopes:
            - write:update-work-item
          scopes_required:
            - write:update-work-item
      x-kong-plugin-key-auth:
        config:
          key_names:
            - apikey
            - x-api-key
          anonymous: anonymous-deny

  # ─── WI Status ───────────────────────────────────────────────────────────
  /IBPS/WIStatus:
    post:
      tags:
        - WI_STATUS
      summary: Retrieve Work Item Status
      description: |
        This API retrieves Work Item status based on one of the following request parameters:

        Scenario 1:
        - CIF ID only → Returns multiple Work Items

        Scenario 2:
        - DBReferenceID only → Returns a single Work Item

        Scenario 3:
        - WI Number only → Returns a single Work Item
      operationId: getWIStatus
      parameters:
        - in: header
          name: X-Correlation-ID
          required: false
          schema:
            type: string
          description: Unique request tracking identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WIStatusRequest"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WIStatusResponse"
        "400":
          description: Business Validation Errors (2000–2999)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WIStatusErrorResponse"
        "500":
          description: Technical Errors (1000–1999)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WIStatusErrorResponse"
      x-kong-plugin-openid-connect:
        name: openid-connect
        enabled: true
        _config: sbo_standard_token_openid_config_int
        config:
          consumer_claim:
            - client_id
          consumer_by:
            - username
          anonymous: anonymous-deny
          scopes:
            - write:get-work-item-status
          scopes_required:
            - write:get-work-item-status
      x-kong-plugin-key-auth:
        config:
          key_names:
            - apikey
            - x-api-key
          anonymous: anonymous-deny

components:
  schemas:

    # ─── Create SR Schemas ───────────────────────────────────────────────────

    CreateSRRequest:
      type: object
      required:
        - ProcessName
        - SubProcessName
        - InitiateAlso
        - Channel
        - DBReferenceID
        - CardDisputeProcess
      properties:
        ProcessName:
          type: string
        SubProcessName:
          type: string
        InitiateAlso:
          type: string
        Channel:
          type: string
          description: Channel identifier.
          examples: ["DEH / MCF"]
        DBReferenceID:
          type: string
          description: Unique Reference ID from DEH or MCF.
          examples: ["12345678"]
        CardDisputeProcess:
          $ref: "#/components/schemas/CardDisputeProcess"
      additionalProperties: false

    CreateSRSuccessResponse:
      type: object
      required: [status, message, referenceNumber]
      properties:
        status:
          type: string
          examples: ["SUCCESS"]
        message:
          type: string
          examples: ["Service Request Created Successfully"]
        referenceNumber:
          type: string
          examples: ["SR123456789"]

    CreateSRErrorResponse:
      type: object
      required:
        - errorCode
        - errorMessage
      properties:
        errorCode:
          type: string
          description: |
            1000–1999 → Technical Errors
            2000–2999 → Business Errors
          examples: ["2001"]
        errorMessage:
          type: string
          examples: ["Invalid Card Number"]

    CardDisputeProcess:
      type: object
      required:
        - CustomerName
        - CIFID
        - MobileNo
        - EmailID
        - CustomerType
        - CardNo
        - CardCRN
        - CardExpiryDate
        - CardStatus
        - IsPremiumCustomer
        - RequestType
        - ReasonOfIssue
        - ActionToBeTaken
        - TransactionDetails
      properties:
        CustomerName:
          type: string
          maxLength: 50
          examples: ["ABC"]
        CIFID:
          type: string
          maxLength: 10
          examples: ["1234567"]
        MobileNo:
          type: string
          maxLength: 15
          examples: ["971501234567"]
        EmailID:
          type: string
          format: email
          maxLength: 50
          examples: ["abc@domain.com"]
        CustomerType:
          type: string
          maxLength: 1
          description: I = Islamic, C = Conventional
          enum: ["I", "C"]
          examples: ["I"]
        CardNo:
          type: string
          maxLength: 16
          examples: ["1234567812345678"]
        CardCRN:
          type: string
          maxLength: 15
        CardExpiryDate:
          type: string
          format: date
          examples: ["2026-12-31"]
        CardStatus:
          type: string
          maxLength: 20
          examples: ["CLSC"]
        IsPremiumCustomer:
          type: string
          maxLength: 1
          enum: ["Y", "N"]
          examples: ["Y"]
        RequestType:
          type: string
          maxLength: 50
          examples: ["Unrecognized Transaction"]
        ReasonOfIssue:
          type: string
          maxLength: 100
        PointOfContact:
          type: string
          maxLength: 50
          description: Mandatory only if RequestType is Unrecognized Transaction
        ActionToBeTaken:
          type: string
          maxLength: 50
        CustomerRemarks:
          type: string
        Channel:
          type: string
          description: Channel identifier.
          examples: ["DEH / MCF"]
        DBReferenceID:
          type: string
          description: Unique Reference ID from DEH or MCF.
          examples: ["12345678"]
        CustomerAction:
          type: string
        IsCardReplacementReq:
          type: string
          examples: ["N"]
        TransactionDetails:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TransactionDetails"
      additionalProperties: false

    TransactionDetails:
      type: object
      required:
        - TransactionRefNo
        - Date
        - AmountInFC
        - AmountInAED
        - MerchantName
        - AuthorizationID
        - DisputeReason
        - Location
      properties:
        TransactionRefNo:
          type: string
          examples: ["TXN10001"]
        Date:
          type: string
          format: date
          examples: ["2026-01-15"]
        AmountInFC:
          type: string
          maxLength: 15
          examples: ["100.00"]
        AmountInAED:
          type: string
          maxLength: 15
          examples: ["367.25"]
        MerchantName:
          type: string
          maxLength: 100
          examples: ["ABC Store"]
        AuthorizationID:
          type: string
          maxLength: 15
          examples: ["AUTH123456"]
        DisputeReason:
          type: string
          maxLength: 15
          default: Fraud
          examples: ["Fraud"]
        Category:
          type: string
          maxLength: 15
          examples: ["Secured"]
        SecuredTransactionType:
          type: string
          maxLength: 10
          examples: ["OTP"]
        Location:
          type: string
          maxLength: 100
          examples: ["Dubai"]
        SERNo:
          type: string
          maxLength: 15
        ARN:
          type: string
          maxLength: 15
      additionalProperties: false

    # ─── Update WI Schemas ───────────────────────────────────────────────────

    ProcessRequest:
      type: object
      required:
        - ProcessName
        - SubProcessName
        - WINumber
        - WIUpdateAction
        - Channel
        - DBReferenceID
      properties:
        ProcessName:
          type: string
          description: Name of the process to be updated.
          examples: ["TS"]
        SubProcessName:
          type: string
          description: Sub Process Name.
          examples: ["Card Dispute / Account Transaction Dispute"]
        WINumber:
          type: string
          description: iBPS WI Number which was created during WI Create Call.
          examples: ["TS-0012342343-process"]
        Channel:
          type: string
          description: Channel identifier.
          examples: ["DEH / MCF"]
        DBReferenceID:
          type: string
          description: Unique Reference ID from DEH or MCF.
          examples: ["12345678"]
        WIUpdateAction:
          type: string
          description: Action to be taken on the WI.
          examples: ["Cancel"]
      additionalProperties: false

    UpdateWISuccessResponse:
      type: object
      required:
        - ReturnCode
        - ReturnDesc
        - WorkitemNumber
        - RequestID
      properties:
        ReturnCode:
          type: string
          description: Success return code.
        ReturnDesc:
          type: string
          description: Success message describing the result.
          examples: ["Success"]
        WorkitemNumber:
          type: string
          description: Unique identifier for the initiated process.
          examples: ["TS-12345-process"]
        RequestID:
          type: string
          description: UUID for request traceability.
          examples: ["123e4567-e89b-12d3-a456-426614174000"]

    UpdateWIErrorResponse:
      type: object
      required:
        - ReturnCode
        - ReturnDesc
        - WorkitemNumber
        - RequestId
      properties:
        ReturnCode:
          type: string
          description: |
            Error code indicating the type of error:
            - 1001–1019: Validation errors
            - 1020–1029: Missing mandatory field
            - 5000–5999: Server errors
          examples: ["1020"]
        ReturnDesc:
          type: string
          description: Detailed description of the error.
          examples: ["Mandatory field missing: ProcessName"]
        WorkitemNumber:
          type: string
          description: Application Number.
          examples: ["TS-00012345-process"]
        RequestId:
          type: string
          description: UUID for request traceability.
          examples: ["123e4567-e89b-12d3-a456-426614174000"]

    # ─── WI Status Schemas ───────────────────────────────────────────────────

    WIStatusRequest:
      type: object
      description: Only one field should be provided per request.
      properties:
        cifId:
          type: string
          examples: ["12345678"]
          description: Customer CIF ID (Scenario 1)
        dbReferenceId:
          type: string
          examples: ["DBREF12345"]
          description: Database Reference ID (Scenario 2)
        wiNumber:
          type: string
          examples: ["TS-0000010234-Process"]
          description: Work Item Number (Scenario 3)
      additionalProperties: false
      oneOf:
        - required: ["cifId"]
        - required: ["dbReferenceId"]
        - required: ["wiNumber"]

    WIStatusResponse:
      type: object
      properties:
        wiDetails:
          type: array
          items:
            $ref: "#/components/schemas/WIDetails"

    WIDetails:
      type: object
      properties:
        wiNumber:
          type: string
          examples: ["TS-0000010234-Process"]
        wiStatus:
          type: string
          examples: ["Open"]
          enum:
            - Open
            - Closed
            - InProgress
            - Rejected
            - Pending
        currentWS:
          type: string
          examples: ["Dispute Investigation"]
        transactionDisputes:
          type: array
          items:
            $ref: "#/components/schemas/TransactionDisputes"

    TransactionDisputes:
      type: object
      properties:
        disputeType:
          type: string
          examples: ["Fraud Transaction"]
        transactionId:
          type: string
          examples: ["TXN458793221"]

    WIStatusErrorResponse:
      type: object
      properties:
        errorCode:
          type: integer
          description: |
            Technical Errors (1000–1999)

            1000 - Unknown Technical Error
            1001 - Database Connection Failure
            1002 - Timeout Error
            1003 - Service Unavailable
            1004 - Invalid JSON Format
            1005 - Internal Server Error

            Business Errors (2000–2999)

            2000 - Validation Failed
            2001 - Invalid CIF ID
            2002 - Invalid DBReferenceID
            2003 - Invalid WI Number
            2004 - WI Not Found
            2005 - Multiple Parameters Provided
            2006 - No Input Parameter Provided
            2007 - Missing Mandatory Field
          examples: [2004]
        errorMessage:
          type: string
          examples: ["WI Not Found"]
        errorType:
          type: string
          enum:
            - Technical
            - Business


            Bopootstrap:

            _format_version: '3.0'
