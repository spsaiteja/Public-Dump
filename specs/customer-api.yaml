x-kong-plugin-pre-function:
  name: pre-function
  config:
    access:
      - |
          return function()
              local request_body, err = kong.request.get_raw_body()

              if request_body then
                  kong.log.set_serialize_value("rb.body", request_body)
              else
                  kong.log.set_serialize_value("rb.body_error", err)
              end

              kong.service.request.enable_buffering()
          end
    log:
      - |
          return function()
              local response_body = kong.service.response.get_raw_body()

              if response_body then
                  kong.log.set_serialize_value("rs.body", response_body)
              end
          end   
