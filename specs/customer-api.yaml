openapi: 3.0.3
info:
  title: Transaction Notify DEH API
  description: This  API is used to notify 3DS transactions for users in the banking system.
  version: 1.0.0
  contact:
    name: API Support
    email: support@bank.com
  license:
    name: Proprietary License
    url: https://bank.com/license
  x-kong-target: internal
servers :
  - url: https://customer-dev.rakbanktst.ae/retail-users/rest
    description: Generated server url    
    x-kong-env: develop
  - url: https://customer-sit.rakbanktst.ae/retail-users/rest
    description: Generated server url    
    x-kong-env: sit
tags:
  - name: 3DS Transaction Notify
    description: Operations for notifying 3DS transactions
x-kong-plugin-openid-connect:
  _config: sbo_digital_bank_virtual_user_openid_config
  config:
   scopes_required:
   - retail:virtual-user
x-kong-plugin-post-function:
  _config: post_function_deh_token_config
x-kong-plugin-route-by-header:
  name: route-by-header
  enabled: true
  config:
    rules:
      - upstream_name: customer-sit2
        condition:
          x-env: sit2
paths:
  /v1/banks/{bankId}/users/3ds-transactions/notify:
    post:
      tags:
        - 3DS Transaction Notify
      summary: Notify 3DS Transaction
      description: Notifies a 3DS transaction.
      operationId: notify3DSTransaction
      parameters:
        - name: bankId
          in: path
          description: Bank ID
          required: true
          explode: false
          schema:
            type: string
          example: RAKBANK
       
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Custom3DSTransactionNotifyRequest'
            example:
              tranRefNumber: "3453453"
              cardNumber: "4567"
              cardType: "VISA"
              merchantName: "AMAZON"
              amount: "500"
              currency: "AED"
              merchantAppUrl: "https://amazon.ae/app"
              retailCIF: "1234567"
              challengeType: "OOB"
              userSegment: "PBG"
              tranTime: "2026-02-02 14:30:00"
              
              

            
               
                
      responses:
        '200':
          description: 3DS transaction notified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Custom3DSTransactionNotifyResponse'
              example:
                successMessage: "transaction notified successfully"
                
               
        "400":
          description: Bad Request
          headers:
            channelcontext:
              description: Provides the error information of the response
              schema:
                $ref: '#/components/schemas/Header'
        "401":
          description: User is Unauthorized
          headers:
            channelcontext:
              description: Provides the error information of the response
              schema:
                $ref: '#/components/schemas/Header'
        "404":
          description: Resource or Data Not found
          headers:
            channelcontext:
              description: Provides the error information of the response
              schema:
                $ref: '#/components/schemas/Header'
        "405":
          description: Invalid HTTP Method
          headers:
            channelcontext:
              description: Provides the error information of the response
              schema:
                $ref: '#/components/schemas/Header'
        "415":
          description: Invalid Media Type
          headers:
            channelcontext:
              description: Provides the error information of the response
              schema:
                $ref: '#/components/schemas/Header'
        "500":
          description: Fatal Exception or Server Errors
          headers:
            channelcontext:
              description: Provides the error information of the response
              schema:
                $ref: '#/components/schemas/Header'

components:
  schemas:
    Custom3DSTransactionNotifyRequest:
      type: object
      required:
        - tranRefNumber
        - cardNumber
        - cardType
        - merchantName
        - amount
        - currency
        - merchantAppUrl
        - retailCIF
        - challengeType
        - userSegment
        - tranTime  
      properties:
        tranRefNumber:
          type: string
          description: Transaction reference number
          example: "323273"
        cardNumber:
          type: string
          description: Card number  
          example: "4567"
        cardType: 
          type: string
          description: Card type
          example: "VISA"
        merchantName:
          type: string
          description: Merchant name
          example: "AMAZON  AE  "
        amount:
          type: string
          description: Amount of the transaction
          example: "500"
        currency:
          type: string
          description: Currency of the transaction
          example: "AED"
        merchantAppUrl:
          type: string
          description: URL of the merchant's application
          example: "https://amazon.ae/app"
        retailCIF:
          type: string
          description: Retail CIF
          example: "1234567"
        challengeType:
          type: string
          description: Type of challenge
          example: "OOB"
        userSegment:
          type: string
          description: User segment
          example: "PBG"
        tranTime:
          type: string
          description: Transaction time
          example: "2026-02-02 14:30:00"
        

    Custom3DSTransactionNotifyResponse:
      type: object
      properties:
         
        status:
          type: string
          description: status of the notify request
          example: "SUCCESS"
        
    

    Header:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/Status"
        pagination:
          $ref: "#/components/schemas/Pagination"
      description: The header information of the API. The header includes details such
        as- status, authorization, pagination, message type, message code and
        description.
    Status:
      type: object
      properties:
        message:
          type: array
          description: Provides the list of messages indicating the success or failure of
            the API response
          items:
            $ref: "#/components/schemas/Message"
      description: Provides the status information of response
    Pagination:
      type: object
      properties:
        totalRecordCount:
          type: string
          description: Total number of records available for the given criteria.
          example: "1459"
        totalPages:
          type: string
          description: total number of pages
        pageNumber:
          type: string
          description: Page number of response
        hasMoreRecords:
          type: string
          description: " whether more records are available or not"
          example: Y
        numRecReturned:
          type: string
          description: The number of records received for the given criteria.
          example: "400"
        nextStartIndex:
          type: string
          description: The start index of next record.
          example: "401"
        indexOfLastRecRecorded:
          type: string
          description: The index of the last record received in this response.
      description: Pagination
    Message:
      type: object
      properties:
        recordReference:
          type: string
          description: The record number which has failed or passed in case of multi
            record APIs
          example: "1"
        message_TYPE:
          type: string
          description: "Type of message that is returned in response. Allowed Values: SU -
            Success, BE - Business Exception, CE - Critical Exception, BC -
            Business Confirmation"
          example: SU
        messageAddlnInfo:
          type: string
          description: Provides the additional information on response.
          example: REFERENCE_ID=3|Bill is already rejected
        messageDesc:
          type: string
          description: Provides the description of the message.
          example: SUCCESS
        messageCode:
          type: string
          description: Provides the code of the message.
          example: "0000"
        nameSpaceInfo:
          type: string
          description: "Provides whether the error is from product or from customization.
            Allowed Values: PROD, CUST"
          example: PROD
      description: Message




