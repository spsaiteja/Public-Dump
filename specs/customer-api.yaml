components:
  schemas:
    CustomerAddAccountRequestObject:
      type: object
      properties:
        header:
          type: object
          properties:
            channel:
              type: string
              example: IB
            channelRef:
              type: string
              example: 'CRF{{$timestamp}}'
            timeStamp:
              type: string
              example: '{{$isoTimestamp}}'
        customer:
          type: object
          properties:
            customerId:
              type: string
              example: '0330190'
        accDetails:
          type: array
          items:
            type: object
            properties:
              currency:
                type: string
                example: AED
              iban:
                type: string
                example: AE430040000077665517113
              instantPmtEnabled:
                type: boolean
                example: false
              updateDefaultAccount:
                type: boolean
                example: true
    CustomerAddAccountResponseObject200:
      type: object
      properties:
        header:
          type: object
          properties:
            channel:
              type: string
              example: IB
            channelRef:
              type: string
              example: CRF1751608750
            timeStamp:
              type: string
              format: date-time
              example: '2025-07-04T08:00:49.972Z'
            statusCode:
              type: string
              example: '000'
            statusDesc:
              type: string
              example: Success
        respDtl:
          type: object
          properties:
            addAccount:
              type: object
              properties:
                code:
                  type: string
                  example: C00000
                desc:
                  type: string
                  example: Positive result
                addAccountDtl:
                  type: array
                  items:
                    type: object
                    properties:
                      iban:
                        type: string
                        example: AE430040000077665517113
                      currency:
                        type: string
                        example: AED
                      bankAccountId:
                        type: string
                        example: '562199'
                      appId:
                        type: string
                        example: '118123'
                      defaultAccount:
                        type: boolean
                        example: true
            updateDefaultAccount:
              type: object
              properties:
                code:
                  type: string
                  example: C00000
                desc:
                  type: string
                  example: Positive Result
                defaultAccDtl:
                  type: object
                  properties:
                    oldDefaultBankAccount:
                      type: object
                      properties:
                        oldBankAccountId:
                          type: string
                          example: '562009'
                        newBankAccountId:
                          type: string
                          example: '562201'
